name: Build & Test

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # libunwind-dev is named because the runner image ships
      # libunwind-14-dev, which conflicts with the one libgstreamer1.0-dev
      # needs; apt resolves that only when asked for the package by name
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libopencv-dev libeigen3-dev libmosquitto-dev libssl-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            wget

      - name: Install ONNX Runtime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          tar xzf onnxruntime-linux-x64-1.20.1.tgz
          sudo cp -r onnxruntime-linux-x64-1.20.1/lib/* /usr/local/lib/
          sudo cp -r onnxruntime-linux-x64-1.20.1/include/* /usr/local/include/
          sudo ldconfig

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          build/tests/test_pipeline
          build/tests/test_serializer
          build/tests/test_latency_tracker
          build/tests/test_sse_server
          build/tests/test_rules
          build/tests/test_inference
          build/tests/test_capture_timestamps
          build/tests/test_lane
          build/tests/test_stall

      # Geometry, filter and protocol code of the simulation; no simulator,
      # ROS or device is involved
      - name: Run the Python tests
        run: |
          pip install numpy pyyaml opencv-python-headless
          python3 -m unittest discover -s simulation/test -p 'test_*.py'
          python3 -m unittest discover -s ros2/video_analytics_bridge/test -p 'test_*.py'

  sanitizers:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - uses: actions/checkout@v4

      # libunwind-dev is named because the runner image ships
      # libunwind-14-dev, which conflicts with the one libgstreamer1.0-dev
      # needs; apt resolves that only when asked for the package by name
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++-12 cmake \
            libopencv-dev libeigen3-dev libmosquitto-dev libssl-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            wget

      - name: Install ONNX Runtime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          tar xzf onnxruntime-linux-x64-1.20.1.tgz
          sudo cp -r onnxruntime-linux-x64-1.20.1/lib/* /usr/local/lib/
          sudo cp -r onnxruntime-linux-x64-1.20.1/include/* /usr/local/include/
          sudo ldconfig

      # Builds with the sanitizer and runs every test under it
      - name: Run tests with ${{ matrix.sanitizer }}
        run: scripts/sanitize.sh ${{ matrix.sanitizer }}
