<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Real-time Video Analytics: C++17 pipeline for YOLOv8 with ONNX Runtime and TensorRT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76e3a0"/>
      <stop offset="1" stop-color="#4cc3ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4cc3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cc3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#76e3a0" font-size="20" font-weight="600" letter-spacing="4">C++17 · YOLOv8 · ONNX RUNTIME · TENSORRT</text>
    <text x="72" y="170" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1">Real-time Video Analytics</text>
    <text x="72" y="218" fill="#b9c4dc" font-size="24">Camera to browser dashboard, multi-threaded, from x86 CPU to Jetson GPU</text>
    <rect x="72" y="244" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <!-- Pipeline: capture, queue, inference, queue, dashboard -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
    <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
      <rect x="72" y="296" width="150" height="64" rx="12"/>
      <rect x="272" y="296" width="150" height="64" rx="12"/>
      <rect x="472" y="296" width="150" height="64" rx="12"/>
      <rect x="672" y="296" width="150" height="64" rx="12"/>
    </g>
    <rect x="472" y="296" width="150" height="64" rx="12" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <g fill="#ffffff">
      <text x="147" y="334">capture</text>
      <text x="347" y="334">frame queue</text>
      <text x="547" y="334">inference ×N</text>
      <text x="747" y="334">SSE + MJPEG</text>
    </g>
    <g stroke="#76e3a0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232 328h30m-9-8 9 8-9 8"/>
      <path d="M432 328h30m-9-8 9 8-9 8"/>
      <path d="M632 328h30m-9-8 9 8-9 8"/>
    </g>
  </g>

  <!-- Measured headline number -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end">
    <text x="1208" y="318" fill="url(#accent)" font-size="76" font-weight="800">46 FPS</text>
    <text x="1208" y="350" fill="#b9c4dc" font-size="19">YOLOv8n · TensorRT FP16</text>
    <text x="1208" y="376" fill="#7f8aa6" font-size="17">Jetson Orin Nano Super, 25 W</text>
  </g>
</svg>
