global:
  scrape_interval: 5s

scrape_configs:
  - job_name: video-analytics
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/secrets/ca.crt
      server_name: app
    basic_auth:
      username: admin
      password_file: /etc/prometheus/secrets/http.password
    static_configs:
      - targets: ["app:9001"]
