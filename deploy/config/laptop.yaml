# Configuration for the stack on an x86 laptop (scripts/run-laptop.sh).
# Same keys as config.yaml, which documents them.

# The NPU holds 4 cameras at 25 FPS with yolov8n and 2 workers; with yolo11s
# the same 4 cameras get about 12 FPS each
model: models/yolov8n.onnx
# The NPU ran this model 4x faster than the CPU here; use `cpu` on a machine
# without one
backend: openvino:NPU
# Two workers let pre-processing and post-processing run in parallel
workers: 2
confidence: 0.4
classes: [person, car]
dwell_seconds: 5

sources:
  # Looped JPEG frames stand in for cameras
  - id: square
    gst: "multifilesrc location=/data/videos/long/f%05d.jpg start-index=1 loop=true caps=image/jpeg,framerate=25/1 ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink"
    zones:
      - name: centre
        points: [[300, 200], [660, 200], [660, 440], [300, 440]]
    lines:
      - name: midline
        a: [0, 300]
        b: [960, 300]
  - id: walkway
    gst: "multifilesrc location=/data/videos/people/f%05d.jpg start-index=1 loop=true caps=image/jpeg,framerate=25/1 ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink"
    lines:
      - name: crossing
        a: [0, 540]
        b: [1920, 540]

  - id: market
    gst: "multifilesrc location=/data/videos/market/f%05d.jpg start-index=1 loop=true caps=image/jpeg,framerate=25/1 ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink"
    lines:
      - name: halfway
        a: [0, 640]
        b: [720, 640]
  - id: parking
    gst: "multifilesrc location=/data/videos/frames/f%05d.jpg start-index=1 loop=true caps=image/jpeg,framerate=25/1 ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink"
    zones:
      - name: lot
        points: [[100, 80], [668, 80], [668, 400], [100, 400]]

mqtt:
  host: mosquitto
  port: 1883
  topic: video-analytics

snapshots:
  dir: snapshots
  keep: 200
