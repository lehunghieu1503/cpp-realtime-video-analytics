# The device side of a CARLA run: only the analytics application, reading the
# simulator's camera from the laptop. Written to the board and started by
# simulation/run.sh, once per run, with the run's id.
services:
  app:
    image: video-analytics:jetson
    runtime: nvidia
    # The camera stream is a TCP connection out to the laptop, and the laptop
    # reads /events on this port
    network_mode: host
    restart: "no"
    environment:
      VA_RUN_ID: ${VA_RUN_ID:?set by simulation/run.sh}
    command: ["--config", "/app/config/carla.yaml", "--port", "${VA_PORT:-9002}"]
    volumes:
      - ./config:/app/config:ro
      # Writable: the TensorRT engines are cached in models/trt-cache/
      - ./models:/app/models
    stop_grace_period: 15s
