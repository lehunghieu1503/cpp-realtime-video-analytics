# TLS only, and every client must log in. Used by docker-compose.secure.yml;
# the files come from scripts/make-secrets.sh.
listener 8883
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
allow_anonymous false
password_file /mosquitto/secrets/mosquitto.passwd
