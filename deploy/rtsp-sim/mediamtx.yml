# RTSP server standing in for network cameras: it loops video files and
# serves them as H.264 and H.265 streams. Used by docker-compose.sim.yml.
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  cam-h264:
    runOnInit: ffmpeg -re -stream_loop -1 -i /videos/walk-1080p-h264.mp4 -c copy -an -f rtsp -rtsp_transport tcp rtsp://localhost:8554/cam-h264
    runOnInitRestart: yes
  cam-h265:
    runOnInit: ffmpeg -re -stream_loop -1 -i /videos/walk-1080p-h265.mp4 -c copy -an -f rtsp -rtsp_transport tcp rtsp://localhost:8554/cam-h265
    runOnInitRestart: yes
