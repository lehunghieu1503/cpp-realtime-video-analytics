# CARLA stage 1: CARLA on a laptop, inference on the device, control on the
# laptop. One file for both sides, so they cannot disagree:
#
#   the device (video_analytics --config) reads the top-level keys, `lane`,
#   `calibration`, `simulation` and `sources`
#   the laptop (simulation/) reads `calibration`, `lane`,
#   `carla`, `metric`, `control` and `routes`
#
# simulation/run.sh copies it to the device for every run, with
# SIM_HOST replaced by the laptop's address, and starts the device with the
# run's id in VA_RUN_ID. See docs/SIMULATION.md.

model: models/yolo11s.onnx
backend: tensorrt-native
precision: fp16
workers: 1
port: 9001
bind: 0.0.0.0
headless: true
confidence: 0.25
tracking: true
# No `classes` key, on purpose: every class reaches the JSON, so a class the
# controller does not brake for is still logged. The controller refuses to
# arm when this key leaves out one of its six hazard classes.

simulation:
  enabled: true   # the run id comes from VA_RUN_ID

# The camera, rigidly on the ego vehicle. Ego frame: x forward, y right, z
# up, origin at the vehicle's origin (on the road, between the axles).
# Source images are 1280x720; nothing is cropped or scaled before the device.
calibration:
  width: 1280
  height: 720
  fov_deg: 52.0
  # Pitched down so that the road is in the image from about 3 m ahead of the
  # camera: the lower edge looks 25 degrees below the horizon, the horizon is
  # at row 129
  camera: {x: 0.6, y: 0.0, z: 1.5, pitch_deg: -10.0}
  ground_z: 0.0
  distortion: [0, 0, 0, 0, 0]

lane:
  model: models/ufld-tusimple18.onnx
  backend: tensorrt-native
  precision: fp16
  roi_x_min_m: 3.0
  roi_x_max_m: 30.0
  reference_x_m: 8.0
  min_points: 5
  min_support_m: 5.0
  max_residual_m: 0.25
  width_min_m: 2.5
  width_max_m: 4.6

sources:
  - id: carla-front
    gst: "tcpclientsrc host=SIM_HOST port=5000 ! gdpdepay ! jpegdec ! videoconvert ! video/x-raw,format=BGR ! appsink sync=false max-buffers=1 drop=true"
    lane: true

# ── Laptop side ──────────────────────────────────────────────────────────────

carla:
  host: 127.0.0.1
  port: 2000
  map: Town04
  fps: 30                  # fixed_delta_seconds = 1/30, synchronous
  ego_blueprint: vehicle.tesla.model3
  # 1280x720 at 30 FPS over the link between the two machines. Measured on
  # the link used so far (a relayed VPN, 120 ms round trip, about 10 Mbit/s):
  # quality 75 is 87 kB a frame, 20 Mbit/s, and only 69 % of the frames came
  # back; quality 30 is 36 to 40 kB, under 10 Mbit/s, and 99 % came back.
  # Quality 20 fits with more room but the detector then misses cars beyond
  # 60 m that it finds at 30.
  jpeg_quality: 30
  sender: {bind: 0.0.0.0, port: 5000, max_queued: 2, client_max_buffers: 30}
  callback_queue: 8
  live_cache_entries: 90   # 3 s of frames a late result can be joined with
  depth_artifact_frames: 1000  # lossless depth kept per run, about 1 MB each;
                               # a 900-tick run and its lead-in fit
  rgb_artifact_every: 0        # keep every Nth JPEG as sent; 0: none
  settle_ticks: 30

metric:
  q_accel: 4.0
  r_floor_m: 0.15
  r_range_fraction: 0.01
  max_gap_s: 0.5

control:
  target_speed_kmh: 9.0    # of every scenario that does not set its own
  speed_cap_kmh: 30.0      # no scenario drives faster, whatever it asks for
  # Budgets, version 2. Version 1 was 200 ms of simulation and 300 ms of wall
  # time, the targets of the plan. They cannot be met on the link used so
  # far: from a tick to its result takes 216 ms at the median, 235 ms at the
  # 95th percentile and up to 432 ms (120 ms of it is the round trip). With
  # both machines on one network the same chain takes 64 ms and version 1
  # holds. tau below covers the larger budget.
  #
  # Perception older than this, in simulation time, is not driven on
  age_limit_ms: 500
  # No accepted command for this long, in wall time: the simulator brakes
  wall_lease_ms: 600
  # The ego state a command was computed for may be this old
  pose_budget_ms: 100
  hazard_classes: [person, bicycle, car, motorcycle, bus, truck]
  # Brake when gap <= v * tau + v^2 / (2 * a_min) + margin
  # a_min: full brake from 2.6 m/s measured 10.3 m/s^2 (scenario
  # vehicle_response); 2.5 is the conservative bound used. tau: the age limit
  # plus the measured 0.1 s from brake command to first deceleration.
  brake: {a_min_mps2: 2.5, tau_s: 0.6, margin_m: 2.0}
  ttc_min_s: 2.0
  # After a brake for an object, this many results in a row must show the
  # path clear before the vehicle drives on: 1 s, longer than the 0.5 s
  # (metric.max_gap_s) a track that is no longer measured is still predicted
  clear_frames: 30
  # An object beyond the lane that was seen is placed against the lane
  # continued by up to this much, when the lane is nearly straight
  extrapolate_m: 20.0
  corridor_margin_m: 0.3
  unknown_closing_mps: 2.0
  pure_pursuit: {lookahead_min_m: 6.0, lookahead_gain_s: 1.0}
  steer: {gain: 1.0, rate_per_s: 2.0}
  speed: {kp: 0.25, ki: 0.15, max_throttle: 0.5, integral_band_mps: 0.5}
  # One park, backwards into a stall (scenarios with a `park` block)
  park:
    k: 0.45                 # share of the full lock used to turn in
    turn_gain: 0.88         # measured wheel angle over the nominal one: scenario
                            # vehicle_response, backwards at steer 0.45, puts
                            # the rear axle on a circle of 5.7 m
    approach_speed_mps: 2.0
    # The most it goes backwards. The plan asked for 0.2 m/s, which this
    # vehicle does not hold: with a throttle up to 0.25 it creeps at 0.07 m/s,
    # and once it runs the same throttle gives 0.5 m/s. Held at 0.2 it moved
    # in bursts of up to 0.48 m/s around a mean of 0.09.
    reverse_speed_mps: 0.5
    reverse_throttle: 0.22  # about what keeps it at three quarters of that
    align_done_deg: 12.0    # from here the vehicle is steered onto the axis
  ready_frames: 3
  arm_age_fraction: 0.6   # to arm, perception must be younger than 60 % of the limit

# Where the ego vehicle starts, snapped to the lane centre. Town04, all on
# level ground (z = 0). A route with yaw_deg is a pose as it stands, not
# snapped to any lane.
routes:
  straight: {x: 13.0, y: 219.9}      # road 46 lane -3: 400 m straight, lanes both sides
  curve_right: {x: -39.4, y: -231.6} # road 23 lane -3: radius about 340 m
  curve_left: {x: -122.6, y: -148.2} # road 23 lane -3
  # Town05, on the widest aisle of its car park, at the east end, heading
  # west. The car park is a paved square 0.16 m above the streets, with a
  # kerb and a fence around it: no lane leads into it and its aisles have no
  # markings. From simulation/probe-stall.py --margin 0.5.
  carpark: {x: 17.03, y: -13.10, z: 0.157, yaw_deg: -90.0}
