# Scenarios of CARLA stage 1. Run one with
#   simulation/run.sh --scenario <name> [--arm] [--device ...]
#
# Other road users are scripted: placed on a lane relative to the ego
# vehicle's start and moved without physics, so a scenario repeats exactly.
#   ahead_m     distance along the lane from the ego vehicle's origin to the
#               actor's origin (a Tesla Model 3 is 2.4 m from origin to bumper)
#   lane        0: the ego lane, 1: the lane to its right, -1: to its left
#   lateral_m   further to the right, metres
#   sweep       the actor stands at each distance for hold_ticks ticks
#   cut_in      the actor slides to another lane, from start_tick on, or,
#               with when_ego_within_m, from when the ego vehicle is that near
# Their positions are written to truth.jsonl for the evaluation and are never
# given to the controller.
#
# `expect` is what simulation/evaluate.py checks. The numbers are targets
# set before the runs; docs/SIMULATION.md has what was measured.
#
# "needs --arm" scenarios drive the vehicle; without --arm it stays braked
# and their expectations fail.

defaults:
  map: Town04
  weather: ClearNoon
  route: straight
  ticks: 600
  rgb_artifact_every: 30   # keep one JPEG a second, as sent, to look at

scenarios:
  # ── No device needed: the vehicle and the sensors themselves ──────────────

  # Steering sign and gain, then braking from about 10 km/h, then backwards
  # with the wheel at 0.45 to the right: which way the vehicle turns in
  # reverse, and the radius of the circle its rear axle is on. Open loop.
  vehicle_response:
    ticks: 880
    depth_artifact_frames: 0
    open_loop:
      - {from_tick: 0, throttle: 0.4}
      - {from_tick: 50, throttle: 0.15, steer: 0.05}    # right
      - {from_tick: 95, throttle: 0.15, steer: -0.05}   # left
      - {from_tick: 185, throttle: 0.15, steer: 0.05}   # back to straight
      - {from_tick: 230, throttle: 0.15}
      - {from_tick: 260, brake: 1.0}
      - {from_tick: 350, throttle: 0.4}
      - {from_tick: 400, throttle: 0.15}
      - {from_tick: 430, brake: 1.0}
      - {from_tick: 520, throttle: 0.25, steer: 0.45, reverse: true}
      - {from_tick: 820, brake: 1.0}
    expect: {steer_sign: true, brake_deceleration_min_mps2: 2.5, collisions: 0}

  # Depth and calibration on the road plane and on cars 5, 10 and 20 m from
  # the camera, on and off the optical axis. With a device it also checks
  # the range the metric tracking gives for them.
  calibration:
    ticks: 360
    depth_fixture: true
    rgb_artifact_every: 10
    # Red points at known places in the ego frame, centre and off axis, 5 to
    # 20 m from the camera, 0.3 to 2 m above the road (on the road itself the
    # lower half of a point is under the surface and its centre reads high).
    # Checked on the first 90 ticks, before the cars appear.
    markers_ego_m: [[5.6, 0.0, 0.3], [5.6, -1.2, 0.3], [5.6, 1.2, 0.3],
                    [10.6, -2.5, 0.3], [10.6, 2.5, 0.3], [10.6, 0.0, 1.0],
                    [20.6, -4.0, 0.3], [20.6, 4.0, 0.3], [20.6, -4.0, 2.0],
                    [20.6, 4.0, 2.0], [16.0, -1.75, 0.5], [16.0, 1.75, 0.5]]
    actors:
      - {name: centre, class: car, blueprint: vehicle.tesla.model3, from_tick: 90,
         sweep: {distances_m: [8.0, 13.0, 23.0], hold_ticks: 90}}
      - {name: right, class: car, blueprint: vehicle.tesla.model3, lane: 1,
         from_tick: 90, sweep: {distances_m: [14.0, 14.0, 24.0], hold_ticks: 90}}
      - {name: left, class: car, blueprint: vehicle.tesla.model3, lane: -1,
         from_tick: 90, sweep: {distances_m: [15.0, 25.0, 25.0], hold_ticks: 90}}
    expect: {depth_is: along_optical_axis, road_height_rmse_m: 0.03,
             reprojection_max_px: 2, range_error_max_m: 0.2, unknown_frames: 0}

  # ── Transport and detection, vehicle braked ───────────────────────────────

  # Nothing but the road: timestamps, throughput, lane model
  baseline:
    ticks: 600
    expect: {unknown_frames: 0, drives: false, lane_coverage: 0.95,
             lane_centre_rmse_m: 0.3}

  # One isolated car at 12 distances up to 120 m, 45 ticks each
  sweep_car:
    ticks: 540
    actors:
      - {name: car, class: car, blueprint: vehicle.tesla.model3,
         sweep: {distances_m: [10, 20, 28, 35, 45, 55, 65, 75, 85, 95, 105, 115],
                 hold_ticks: 45}}
    expect: {unknown_frames: 0}

  sweep_person:
    ticks: 540
    actors:
      - {name: person, class: person, blueprint: walker.pedestrian.0001,
         sweep: {distances_m: [10, 20, 28, 35, 45, 55, 65, 75, 85, 95, 105, 115],
                 hold_ticks: 45}}
    expect: {unknown_frames: 0}

  # The other four hazard classes, one at a time, 20 m and 40 m ahead
  sweep_classes:
    ticks: 480
    actors:
      - {name: truck, class: truck, blueprint: vehicle.carlamotors.carlacola,
         from_tick: 0, until_tick: 120, sweep: {distances_m: [22, 42], hold_ticks: 60}}
      - {name: bus, class: bus, blueprint: vehicle.mitsubishi.fusorosa,
         from_tick: 120, until_tick: 240,
         sweep: {distances_m: [22, 42], hold_ticks: 60}}
      - {name: motorcycle, class: motorcycle, blueprint: vehicle.yamaha.yzf,
         from_tick: 240, until_tick: 360,
         sweep: {distances_m: [20, 40], hold_ticks: 60}}
      - {name: bicycle, class: bicycle, blueprint: vehicle.diamondback.century,
         from_tick: 360, until_tick: 480,
         sweep: {distances_m: [20, 40], hold_ticks: 60}}
    expect: {unknown_frames: 0}

  # ── Metric tracking: position, velocity, acceleration ─────────────────────

  # Ego stands; a car drives away at a constant 3 m/s
  metric_constant_speed:
    ticks: 300
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3,
         ahead_m: 9.0, speed_mps: 3.0}
    expect: {speed_rmse_mps: 0.5, range_error_max_m: 0.2}

  # Ego stands; a car accelerates away at 1.5 m/s^2 up to 9 m/s
  metric_accelerating:
    ticks: 330
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3,
         ahead_m: 9.0, speed_mps: 0.0, accel_mps2: 1.5, max_speed_mps: 9.0,
         move_from_tick: 60}
    expect: {speed_rmse_mps: 0.5, accel_rmse_mps2: 1.0}

  # Ego drives past a car parked in the next lane: its world velocity must
  # stay near zero although it moves in the image. Needs --arm.
  metric_parked_ego_moving:
    ticks: 600
    target_speed_kmh: 9.0   # at 50 km/h the car's speed is 0.77 m/s off, not 0.5
    actors:
      - {name: parked, class: car, blueprint: vehicle.tesla.model3,
         ahead_m: 45.0, lane: 1}
    expect: {speed_rmse_mps: 0.5, drives: true, stops: false, collisions: 0}

  # ── Lane keeping, no obstacles. Need --arm ────────────────────────────────

  lane_straight:
    ticks: 900
    expect: &lane_expectations
      {drives: true, stops: false, collisions: 0, lateral_rmse_m: 0.3,
       max_lateral_deviation_m: 0.6, lane_coverage: 0.95, lane_centre_rmse_m: 0.3,
       unknown_frames: 0}

  # This stretch has more in view: at quality 30 its frames are 45 kB,
  # 10.7 Mbit/s, more than the link carried; at 25 they fit.
  # 760 ticks: the curve ends 298 m from the start of this route, where the
  # ramp of lane_ramp begins; at 50 km/h it gets there
  lane_curve_right:
    route: curve_right
    jpeg_quality: 25
    ticks: 760
    expect: *lane_expectations

  # 500 ticks: the same place is 180 m from the start of this one
  lane_curve_left:
    route: curve_left
    ticks: 500
    expect: *lane_expectations

  # The ramp that road ends in: to the left, about 100 m radius, at the
  # 30 km/h a ramp is driven at. Where it begins the TuSimple lane model gave
  # a lane of the wrong width and the vehicle stopped. At 50 km/h the lane is
  # still found, and the vehicle runs 0.7 m outside its centre.
  lane_ramp:
    route: ramp
    jpeg_quality: 25
    ticks: 760
    target_speed_kmh: 30.0
    expect: *lane_expectations

  # Starts 0.5 m right of the lane centre, 2 degrees off its direction
  lane_offset_start:
    ticks: 900
    ego_lateral_m: 0.5
    ego_yaw_offset_deg: 2.0
    expect: {drives: true, stops: false, collisions: 0, max_lateral_deviation_m: 0.8,
             unknown_frames: 0}

  # ── Obstacle braking. Need --arm ──────────────────────────────────────────

  brake_static_car: &brake_static_car
    ticks: 900
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3, ahead_m: 40.0}
    # Stopped near the obstacle, not somewhere before it for another reason:
    # the gap left is between 1 m and 12 m. The stop reason is reported; with
    # an object close ahead the lane model can lose the lane first, which
    # stops the vehicle too.
    expect: &brake_expectations
      {drives: true, stops: true, min_gap_m: 1.0, max_gap_m: 12.0, collisions: 0}

  brake_static_car_30:
    <<: *brake_static_car
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3, ahead_m: 30.0}

  brake_static_car_50:
    <<: *brake_static_car
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3, ahead_m: 50.0,
         lateral_m: 0.5}

  brake_static_car_curve:
    <<: *brake_static_car
    route: curve_right
    jpeg_quality: 25
    actors:
      - {name: lead, class: car, blueprint: vehicle.audi.tt, ahead_m: 45.0}

  brake_truck:
    <<: *brake_static_car
    actors:
      - {name: lead, class: truck, blueprint: vehicle.carlamotors.carlacola,
         ahead_m: 45.0, lateral_m: -0.4}

  brake_person:
    ticks: 900
    actors:
      - {name: person, class: person, blueprint: walker.pedestrian.0001, ahead_m: 35.0}
    expect: *brake_expectations

  brake_person_offset:
    ticks: 900
    actors:
      - {name: person, class: person, blueprint: walker.pedestrian.0001,
         ahead_m: 42.0, lateral_m: 0.8}
    expect: *brake_expectations

  # A slower car in the next lane moves into the ego lane ahead of the vehicle.
  # 600 ticks: the vehicle stands from about tick 200; near tick 800 that car,
  # at 1 m/s, is far enough for it to drive on, and whether the run then ends
  # on the next brake or before it is chance
  brake_cut_in:
    ticks: 600
    actors:
      - {name: cutter, class: car, blueprint: vehicle.tesla.model3, ahead_m: 22.0,
         lane: 1, speed_mps: 1.0, cut_in: {start_tick: 30, duration_ticks: 60, to_lane: 0}}
    expect: *brake_expectations

  # Cars and a person beside the lane: nothing to brake for
  negative_adjacent:
    ticks: 900
    actors:
      - {name: right_20, class: car, blueprint: vehicle.tesla.model3, ahead_m: 20.0, lane: 1}
      - {name: right_45, class: car, blueprint: vehicle.audi.tt, ahead_m: 45.0, lane: 1}
      - {name: left_30, class: car, blueprint: vehicle.tesla.model3, ahead_m: 30.0, lane: -1}
      - {name: left_55, class: truck, blueprint: vehicle.carlamotors.carlacola,
         ahead_m: 55.0, lane: -1}
      - {name: verge, class: person, blueprint: walker.pedestrian.0001,
         ahead_m: 38.0, lane: 1, lateral_m: 0.8}
    expect: {drives: true, no_stop_reason_prefix: obstacle, collisions: 0}

  # ── The drive show. Needs --arm ───────────────────────────────────────────
  # One run on the straight of Town04, at up to 50 km/h:
  #   ticks    0 to 300   follows the car ahead (30 km/h), 37 m behind it
  #   ticks  300 to 365   after 10 s behind it: moves one lane to the left
  #   ticks  365 to 745   speeds up to 50 km/h, passes that car at about 725
  #   ticks 1050 to 1110  a person walks across its lane: it stops
  #   from about 1110     the person has left the lane: it drives on
  # The speed and the follow gap are this scenario's own, and that the
  # vehicle may overtake; the controller reads them from the run's manifest.
  # When it moves over, and to which side, it sees for itself: the scenario
  # names no tick and no side. The ticks above are what was measured. The
  # car ahead has
  # physics (a collision with it is a collision); the person is placed, tick
  # by tick, from the left shoulder to the right one, and has left the next
  # lane 3 s before the passed car gets there.
  show_drive:
    ticks: 1400
    jpeg_quality: 75       # one PC: there is no link to fit
    target_speed_kmh: 50.0
    follow_gap_m: 45.0     # the stopping distance from the lead's 30 km/h is 14 m
    overtake: true         # when and to which side is the controller's to see
    actors:
      - {name: lead, class: car, blueprint: vehicle.tesla.model3, ahead_m: 25.0,
         physics: true, speed_mps: 8.33}
      - {name: walker, class: person, blueprint: walker.pedestrian.0001,
         ahead_m: 400.0, lane: -2.6, yaw_deg: 90.0,
         cut_in: {when_ego_within_m: 82.0, duration_ticks: 300, to_lane: 1.6}}
    # A lane change that was skipped is logged and fails the show. The
    # person has no physics, so the collision sensor would not notice it
    # being hit: the boxes are compared instead.
    expect: {drives: true, follows: 2.0, lane_change: done, resumes: person,
             no_box_overlap: [walker, lead], collisions: 0}

  # ── The park show. Needs --arm ────────────────────────────────────────────
  # Town05's car park, as the map has it: 17 parked cars in its 60 stalls.
  # The scenario says where the vehicle starts and that it parks, not where.
  # It drives along the aisle at 2 m/s; the stall model finds, in the rear
  # camera's image, the stalls it has passed. The first that is empty, wide
  # enough, and whose neighbour passed before it is empty too, it backs
  # into: along the aisle to the turning point, a quarter circle, straight
  # to the centre, at 0.5 m/s at most. Ends with the parking brake set, nose
  # out.
  #
  # `expect` is the evaluation's side, read with the stalls measured on the
  # paint (carla-stalls.yaml); none of it reaches the controller. `parked`
  # asks for a stall that was empty when the run began, as was the stall
  # passed before it. Here the first two stalls of the row hold the map's
  # pick-ups and the third is beside one of them: the fourth is the first
  # it may take.
  show_park: &show_park
    map: Town05
    route: carpark
    ticks: 2700
    jpeg_quality: 75
    park: true
    expect: {drives: true, parked: 15, collisions: 0, no_box_overlap: true}

  # A car in the third stall. The fourth is now beside a car on the side
  # the front swings over; the fifth is not.
  show_park_next: &show_park_next
    <<: *show_park
    actors:
      - {name: in_the_third, class: car, blueprint: vehicle.tesla.model3,
         physics: true, at: {x: 9.77, y: -24.36, z: 0.158, yaw_deg: 0.0}}
    expect: {drives: true, parked: 15, collisions: 0, no_box_overlap: true}

  # Cars in the third, fifth and seventh stall; the last two hold the map's
  # own. No stall is left that it may take: the park must be given up at the
  # end of the search, without going backwards.
  show_park_occupied: &show_park_occupied
    <<: *show_park
    ticks: 1200
    actors:
      - {name: in_the_third, class: car, blueprint: vehicle.tesla.model3,
         physics: true, at: {x: 9.77, y: -24.36, z: 0.158, yaw_deg: 0.0}}
      - {name: in_the_fifth, class: car, blueprint: vehicle.audi.tt,
         physics: true, at: {x: 9.77, y: -29.94, z: 0.158, yaw_deg: 180.0}}
      - {name: in_the_seventh, class: car, blueprint: vehicle.tesla.model3,
         physics: true, at: {x: 9.77, y: -35.52, z: 0.158, yaw_deg: 0.0}}
    # Passes when the park is given up as it should be. Parked anyway, in a
    # stall at any time, a collision, a box over another car's, or going
    # backwards: fails.
    expect: {park_abort: no_free_stall, collisions: 0}

  # The same three with the stalls found in the bird's-eye view: the device
  # makes it of the rear camera and the two under the mirrors (the `bev`
  # section of the configuration) and runs that section's stall model on it.
  # The rest is the same: the controller, what it may take, what is expected.
  show_park_bev: {<<: *show_park, bev: true}
  show_park_next_bev: {<<: *show_park_next, bev: true}
  show_park_occupied_bev: {<<: *show_park_occupied, bev: true}

  # ── Faults. Need --arm ────────────────────────────────────────────────────
  # The vehicle is driving when the fault starts; it must be braked within
  # the budget of simulation/config/carla.yaml plus one tick: age_limit_ms of
  # simulation when data stops, wall_lease_ms when the controller is gone.

  fault_no_frames:      # the camera stream stops reaching the device
    ticks: 500
    faults: [{kind: drop_rgb, from_tick: 300}]
    expect: {drives: true, stops: true, fault_brake_by_deadline: true, collisions: 0}

  fault_no_depth:       # the depth image stops reaching the controller
    ticks: 500
    faults: [{kind: drop_depth, from_tick: 300}]
    expect: {drives: true, stops: true, fault_brake_by_deadline: true, collisions: 0}

  fault_controller_killed:   # SIGKILL; the simulator keeps ticking
    ticks: 500
    faults: [{kind: kill_controller, from_tick: 300}]
    expect: {drives: true, fault_brake_by_deadline: true, collisions: 0}

  # Commands the simulator must refuse, sent while the vehicle is braked and
  # not armed: none of them may move it. Run without --arm.
  fault_forged_commands:
    ticks: 240
    faults:
      - kind: forge_commands
        from_tick: 120
        until_tick: 121
        commands:
          - {run_id: r_other, source: carla-front, command_seq: 900000, basis_sim_ns: 0,
             control_sim_ns: 0, control_frame: 0, valid_until_sim_ns: 0,
             throttle: 1.0, brake: 0.0, steer: 0.0, reason: ""}
          - {throttle: 1.0, brake: 0.0}
          - "full throttle"
    expect: {drives: false, commands_rejected: [wrong_run, not_an_object]}

  # ── Negative control ──────────────────────────────────────────────────────
  # A car drives into the standing ego vehicle. Everything else about the run
  # is fine; the evaluation is right only if it fails the run.
  negative_control_collision:
    ticks: 300
    actors:
      - {name: rammer, class: car, blueprint: vehicle.tesla.model3, ahead_m: 25.0,
         yaw_deg: 180.0, physics: true, speed_mps: 4.0, move_from_tick: 60}
    expect: {collisions: 0, evaluator_must_fail: true}

  # ── Sustained run: 10 minutes, vehicle braked ─────────────────────────────
  # Transport, the two engines on the device and the control loop at their
  # real rates. The scene is static so that the rates are the only variable.
  sustained:
    ticks: 18000
    depth_artifact_frames: 300
    rgb_artifact_every: 900
    expect: {unknown_frames: 0}
